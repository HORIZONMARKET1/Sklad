<script>  
/* ВРЕМЕННЫЙ ДИАГНОСТИЧЕСКИЙ БЛОК: если где-то ниже упадёт ошибка до того,  
   как отрисуется интерфейс, вместо белого экрана покажем текст ошибки.  
   Это НЕ часть обычной логики приложения — просто чтобы найти баг. */  
(function(){  
  function showErr(msg){  
    var box = document.getElementById('__diagErr');  
    if(!box){  
      box = document.createElement('div');  
      box.id = '__diagErr';  
      box.style.cssText = 'position:fixed;inset:0;background:#1a0000;color:#ffb3b3;'  
        + 'font:13px/1.5 monospace;padding:16px;z-index:999999;overflow:auto;white-space:pre-wrap;';  
      document.documentElement.appendChild(box);  
    }  
    box.textContent += msg + '\n\n';  
  }  
  window.addEventListener('error', function(e){  
    showErr('JS ERROR: ' + (e.message || e) + '\nat ' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||''));  
  });  
  window.addEventListener('unhandledrejection', function(e){  
    showErr('PROMISE REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)));  
  });  
})();  
</script>

<style>  
  :root{  
    --bg:#0d0f14;  
    --bg2:#141822;  
    --card:#1a1f2b;  
    --card2:#212736;  
    --accent:#5b8dff;  
    --accent2:#3ddc97;  
    --accent-grad: linear-gradient(135deg,#5b8dff,#3ddc97);  
    --danger:#ff5c6c;  
    --danger-grad: linear-gradient(135deg,#ff6b6b,#ff3d5f);  
    --text:#f1f3f9;  
    --muted:#8b93a7;  
    --border:#262c3b;  
    --radius:16px;  
    --radius-sm:11px;  
    --safe-t: env(safe-area-inset-top, 0px);  
    --safe-b: env(safe-area-inset-bottom, 0px);  
    --fs-base: clamp(14px, 3.6vw, 16px);  
  }  
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}  
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);  
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;  
    font-size:var(--fs-base);  
    overscroll-behavior-y:none;}  
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);}  
  
  button{font-family:inherit;}  
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}  
  
  /* ---------- BUTTON SYSTEM (MODERN) ---------- */  
  .btn{  
    display:flex;align-items:center;justify-content:center;gap:8px;  
    width:100%;padding:clamp(12px,3.4vw,15px);  
    border:none;border-radius:var(--radius-sm);  
    background:var(--accent-grad);  
    color:#06110b;  
    font-size:clamp(14px,3.7vw,16px);font-weight:700;  
    cursor:pointer;  
    box-shadow:0 6px 18px -6px rgba(91,141,255,.55);  
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s;  
    -webkit-user-select:none;user-select:none;  
  }  
  .btn:active{transform:scale(.97);box-shadow:0 3px 10px -4px rgba(91,141,255,.5);}  
  .btn.secondary{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--border);}  
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);box-shadow:none;}  
  .btn.danger{background:var(--danger-grad);color:#fff;box-shadow:0 6px 18px -6px rgba(255,92,108,.5);}  
  .btn.sm{padding:9px 12px;font-size:12.5px;width:auto;border-radius:10px;}  
  .btn:disabled{opacity:.5;pointer-events:none;}  
  
  .icon-btn{  
    width:36px;height:36px;min-width:36px;border-radius:11px;border:1px solid var(--border);  
    background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center;  
    font-size:16px;cursor:pointer;transition:.15s;  
  }  
  .icon-btn:active{transform:scale(.92);background:var(--card);}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">  
  <defs>

function svgToPngDataUrl(svgString, size){  
  return new Promise((resolve)=>{  
    const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);  
    const img = new Image();  
    img.onload = function(){  
      const canvas = document.createElement('canvas');  
      canvas.width = size; canvas.height = size;  
      const ctx = canvas.getContext('2d');  
      ctx.drawImage(img, 0, 0, size, size);  
      resolve(canvas.toDataURL('image/png'));  
    };  
    img.onerror = function(){ resolve(null); };  
    img.src = svgUrl;  
  });  
}

}

const firebaseConfig = {

/* Подгружает один <script> динамически и ждёт либо загрузки, либо таймаута  
   (timeoutMs) — что наступит раньше. Возвращает true/false, никогда не  
   бросает исключение, поэтому не может подвесить или сломать остальной код. */  
function loadScript(src, timeoutMs){  
  return new Promise((resolve)=>{  
    let done = false;  
    const finish = (ok)=>{ if(done) return; done = true; resolve(ok); };  
    const tag = document.createElement('script');  
    tag.src = src;  
    tag.onload = ()=> finish(true);  
    tag.onerror = ()=> finish(false);  
    document.head.appendChild(tag);  
    setTimeout(()=> finish(false), timeoutMs);  
  });  
}  
  
/* Пытается подключить Firebase SDK и базу. Если сеть до gstatic.com  
   недоступна/медленная (частая ситуация в РФ/Таджикистане/Узбекистане) —  
   просто тихо остаётся в офлайн-режиме (fbAvailable=false) максимум через  
   4с на каждый файл, не блокируя и не ломая остальной интерфейс. */  
async function initFirebase(){  
  try{  
    const okApp = await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js', 4000);  
    if(!okApp || typeof firebase === 'undefined') return;  
    const okDb = await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js', 4000);  
    if(!okDb || !firebase.database) return;  
    fbApp = firebase.initializeApp(firebaseConfig);  
    fbDb = firebase.database();  
    fbAvailable = true;  
    // Messaging (push-уведомления) — необязателен, грузим отдельно и не ждём  
    loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js', 4000)  
      .then((okMsg)=>{  
        try{  
          if(okMsg && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported()){  
            fcmMessaging = firebase.messaging();  
          }  
        }catch(e){ /* браузер без поддержки FCM (например, iOS Safari без PWA) */ }  
      });  
  }catch(e){  
    console.warn('Firebase недоступен, приложение работает в локальном режиме:', e);  
  }  
}  
  
/* ============================= PUSH-УВЕДОМЛЕНИЯ (FCM + Cloud Functions) =========  
   ВАЖНО: чтобы push реально работал (в т.ч. когда приложение закрыто), нужно:  
   1) Задеплоить Cloud Function из папки backend/functions (см. backend/README.md).  
   2) Разместить файл firebase-messaging-sw.js в КОРНЕ сайта (рядом с этим HTML).  
   3) В консоли Firebase → Project settings → Cloud Messaging → Web Push  
      certificates → сгенерировать пару ключей и вставить публичный ключ ниже.  
   Пока VAPID_KEY не заполнен, приложение просто не будет пытаться получить  
   токен устройства — остальной функционал при этом работает как обычно.  
================================================================================= */  
const VAPID_KEY = ''; // <-- вставьте сюда ключ из Firebase Console (Web Push certificates)  
let fcmMessaging = null; // назначается внутри initFirebase() после успешной загрузки SDK  
  
/* Регистрирует service worker, получает FCM-токен этого устройства и  
   сохраняет его в профиле текущего пользователя, чтобы backend знал,  
   куда слать push. Вызывается для admin/manager после входа и по кнопке  
   в профиле. Ничего не делает, если VAPID_KEY не настроен. */  
async function registerPushForCurrentUser(){  
  const u = currentUser();  
  if(!u || (u.role!=='admin' && u.role!=='manager')) return false;  
  if(!fcmMessaging || !VAPID_KEY) return false;  
  if(typeof Notification === 'undefined') return false;  
  try{  
    let perm = Notification.permission;  
    if(perm === 'default') perm = await Notification.requestPermission();  
    if(perm !== 'granted') return false;  
    const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');  
    const token = await fcmMessaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });  
    if(!token) return false;  
    if(!Array.isArray(u.fcmTokens)) u.fcmTokens = [];  
    if(!u.fcmTokens.includes(token)){  
      u.fcmTokens.push(token);  
      saveDB(DB);  
    }  
    return true;  
  }catch(e){  
    console.warn('Не удалось включить push-уведомления:', e);  
    return false;  
  }  
}

/* ---------- Хэширование паролей (SHA-256 + соль, Web Crypto API) ----------  
   Пароли больше не хранятся в открытом виде: при регистрации/смене пароля  
   создаётся случайная соль, и в базе сохраняется только соль + хэш.  
   Это не заменяет полноценный Firebase Authentication, но не даёт  
   администратору БД или любому, кто открыл консоль Firebase, увидеть  
   реальные пароли пользователей. */  
function randomSalt(){  
  const arr = new Uint8Array(16);  
  crypto.getRandomValues(arr);  
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');  
}  
async function sha256Hex(text){  
  const enc = new TextEncoder().encode(text);  
  const buf = await crypto.subtle.digest('SHA-256', enc);  
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');  
}  
async function hashPassword(plain, salt){ return sha256Hex(salt + ':' + plain); }  
async function setUserPassword(user, plain){  
  user.salt = randomSalt();  
  user.passwordHash = await hashPassword(plain, user.salt);  
  delete user.password; // убираем старое открытое поле, если было  
}  
async function checkUserPassword(user, plain){  
  if(user.passwordHash && user.salt) return (await hashPassword(plain, user.salt)) === user.passwordHash;  
  // старые записи без хэша (миграция ещё не прошла) — сверяем напрямую и сразу мигрируем  
  if(user.password != null) return user.password === plain;  
  return false;  
}  
  
const DEFAULT_WAREHOUSE_ID = 'wh_default';  
  
function defaultDB(){

    users: [

    ],

    lines: [],

    history: [], // журнал: приход/продажа товара, кто и когда

/* Приводит загруженную/полученную из Firebase базу к актуальной структуре:  
   добавляет склады, привязку линий к складу, поля категории/минимума/резерва  
   у товаров — так старые данные не ломаются при обновлении приложения. */  
function migrateDBShape(d){  
  if(!Array.isArray(d.warehouses) || d.warehouses.length===0){  
    d.warehouses = [ { id: DEFAULT_WAREHOUSE_ID, name: 'Основной склад' } ];  
  }  
  const firstWhId = d.warehouses[0].id;  
  // Firebase Realtime Database не хранит пустые массивы — если в ряду нет  
  // товаров ([]) или в линии нет рядов ([]), после записи/чтения из Firebase  
  // это поле пропадает совсем (undefined). Поэтому здесь не просто читаем  
  // с фолбэком (||[]), а ГАРАНТИРОВАННО проставляем массив обратно в объект,  
  // иначе остальной код (который делает row.items.forEach и т.п. без  
  // дополнительных проверок) упадёт при следующем открытии приложения.  
  if(!Array.isArray(d.lines)) d.lines = [];  
  d.lines.forEach(line=>{  
    if(!line.warehouseId) line.warehouseId = firstWhId;  
    if(!Array.isArray(line.rows)) line.rows = [];  
    line.rows.forEach(row=>{  
      if(!Array.isArray(row.items)) row.items = [];  
      row.items.forEach(it=>{  
        if(typeof it.minQty !== 'number') it.minQty = 0;  
        if(typeof it.reserved !== 'number') it.reserved = 0;  
        if(typeof it.category !== 'string') it.category = '';  
        if(typeof it.comment !== 'string') it.comment = '';  
      });  
    });  
  });  
  if(!Array.isArray(d.unassigned)) d.unassigned = [];  
  d.unassigned.forEach(it=>{  
    if(!it.warehouseId) it.warehouseId = firstWhId;  
    if(typeof it.minQty !== 'number') it.minQty = 0;  
    if(typeof it.reserved !== 'number') it.reserved = 0;  
    if(typeof it.category !== 'string') it.category = '';  
    if(typeof it.comment !== 'string') it.comment = '';  
  });  
  if(!Array.isArray(d.history)) d.history = [];  
  if(!Array.isArray(d.undoStack)) d.undoStack = [];  
  return d;  
}  
  
/* Безопасная обёртка над localStorage: в редких случаях (приватный режим  
   браузера, локальные ограничения при открытии файла напрямую) доступ к  
   localStorage может выбрасывать ошибку — тогда работаем в памяти, чтобы  
   приложение всё равно открылось (данные в этом случае не переживут  
   перезагрузку страницы, но это лучше, чем чёрный экран). */  
const memoryStore = {};  
const safeStorage = {  
  getItem(key){  
    try{ return localStorage.getItem(key); }  
    catch(e){ return (key in memoryStore) ? memoryStore[key] : null; }  
  },  
  setItem(key, value){  
    try{ localStorage.setItem(key, value); }  
    catch(e){ memoryStore[key] = value; }  
  },  
  removeItem(key){  
    try{ localStorage.removeItem(key); }  
    catch(e){ delete memoryStore[key]; }  
  }  
};  
  
function loadDB(){  
  let raw = safeStorage.getItem(DB_KEY);  
  if(!raw){ const d = defaultDB(); safeStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }  
  try{  
    const d = migrateDBShape(JSON.parse(raw));  
    return d;  
  }catch(e){ const d = defaultDB(); safeStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }  
}  
function saveDBLocal(db){ safeStorage.setItem(DB_KEY, JSON.stringify(db)); }  
  
/* Хэширует пароли всех пользователей, у которых они ещё хранятся открытым  
   текстом (старые записи или самый первый запуск с дефолтным админом). */  
async function migratePlaintextPasswords(db){  
  let changed = false;  
  for(const u of db.users){  
    if(u.password != null && !u.passwordHash){  
      await setUserPassword(u, u.password);  
      changed = true;  
    }  
  }  
  return changed;  
}  
  
function logEvent(type, {sku, lineName, rowName, warehouseName, qty}){  
  const u = currentUser();  
  DB.history.push({  
    id: uid(),  
    type,               // 'in' — приход/новый товар, 'out' — продано  
    sku, lineName, rowName, warehouseName, qty,  
    byLogin: u ? u.login : '',  
    byFio: u ? u.fio : '',  
    at: Date.now()  
  });  
  if(DB.history.length > 5000) DB.history.splice(0, DB.history.length - 5000);  
}  
  
function computeStats(){  
  let totalModels = 0;  
  DB.lines.forEach(l => l.rows.forEach(r => totalModels += r.items.length));  
  totalModels += DB.unassigned.length;  
  let totalIn = 0, totalOut = 0;  
  const byUser = {};  
  DB.history.forEach(ev=>{  
    if(ev.type === 'in'){  
      totalIn += ev.qty;  
      if(!byUser[ev.byLogin]) byUser[ev.byLogin] = { fio: ev.byFio, login: ev.byLogin, qty: 0 };  
      byUser[ev.byLogin].qty += ev.qty;  
    } else if(ev.type === 'out'){  
      totalOut += ev.qty;  
    }  
  });  
  const byUserList = Object.values(byUser).sort((a,b)=> b.qty - a.qty);  
  return { totalModels, totalIn, totalOut, byUserList };  
}  
  
/* Последние 14 дней прихода/продаж — данные для графика в статистике */  
function computeDailySeries(days){  
  const now = new Date();  
  const buckets = [];  
  for(let i=days-1;i>=0;i--){  
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);  
    buckets.push({ key: d.toISOString().slice(0,10), label: d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}), in:0, out:0 });  
  }  
  const byKey = Object.fromEntries(buckets.map(b=>[b.key,b]));  
  DB.history.forEach(ev=>{  
    const key = new Date(ev.at).toISOString().slice(0,10);  
    const b = byKey[key];  
    if(!b) return;  
    if(ev.type==='in') b.in += ev.qty; else if(ev.type==='out') b.out += ev.qty;  
  });  
  return buckets;  
}  
  
/* Товары с остатком на/ниже установленного минимума (minQty > 0) */  
function computeLowStock(){  
  const res = [];  
  DB.lines.forEach(line=>{  
    line.rows.forEach(row=>{  
      row.items.forEach(it=>{  
        if(it.minQty > 0 && it.qty <= it.minQty){  
          res.push({ line, row, item: it });  
        }  
      });  
    });  
  });  
  DB.unassigned.forEach(it=>{  
    if(it.minQty > 0 && it.qty <= it.minQty){  
      res.push({ line:null, row:null, item: it });  
    }  
  });  
  return res;  
}  

/* Сводка по артикулам на текущем складе: одинаковые артикулы (без учёта
   регистра/пробелов), встречающиеся в разных линиях/рядах, суммируются
   в один общий остаток. Возвращает список { sku, qty, entries } —
   entries хранит все места (line/row/item), где хранится этот артикул,
   для показа расшифровки по нажатию. Отсортировано по возрастанию qty,
   чтобы самые критичные позиции были сверху. */
function computeSkuAggregates(){
  const list = amCollect();
  const map = new Map();
  list.forEach(x=>{
    const key = String(x.item.sku||'').trim().toLowerCase();
    if(!key) return;
    if(!map.has(key)) map.set(key, { sku: x.item.sku, qty: 0, entries: [] });
    const agg = map.get(key);
    agg.qty += x.item.qty;
    agg.entries.push(x);
  });
  return Array.from(map.values()).sort((a,b)=> a.qty - b.qty || a.sku.localeCompare(b.sku, 'ru'));
}

/* Показывает системное уведомление браузера (если открыта вкладка и есть разрешение)  
   администратору/менеджеру, когда появляется новый пользователь, ожидающий доступа.  
   Ограничение: работает только пока приложение открыто в браузере — это не полноценный  
   push через Firebase Cloud Messaging (для него нужен отдельный сервер/Cloud Functions). */  
function checkNewRegistrations(){  
  const u = currentUser();  
  if(!u || (u.role!=='admin' && u.role!=='manager')) return;  
  const pending = DB.users.filter(x=>x.role==='user' && x.access==='none').length;  
  if(knownPendingCount === null){ knownPendingCount = pending; return; }  
  if(pending > knownPendingCount && typeof Notification !== 'undefined' && Notification.permission === 'granted'){  
    new Notification('Склад', { body: 'Новый пользователь ожидает доступа' });  
  }  
  knownPendingCount = pending;  
}  
  
/* ---------- Firebase read/write ---------- */  
async function fbPull(){  
  if(!fbAvailable){ fbStatus = 'off'; updateSyncBar(); return false; }  
  fbStatus = 'syncing'; updateSyncBar();  
  try{  
    const snap = await fbDb.ref(FB_DATA_PATH).get();  
    if(snap.exists()){  
      const remote = snap.val();  
      if(remote && remote.users && remote.lines){  
        DB = migrateDBShape(remote);  
        saveDBLocal(DB);  
        checkNewRegistrations();  
      }  
    }  
    fbStatus = 'ok'; fbLastSync = new Date();  
    return true;  
  }catch(e){  
    fbStatus = 'error';  
    return false;  
  }finally{  
    updateSyncBar();  
  }  
}  
  
function scheduleFbSave(){  
  if(!fbAvailable) return;  
  clearTimeout(fbSaveTimer);  
  fbSaveTimer = setTimeout(fbPush, 500);  
}  
  
async function fbPush(){  
  if(!fbAvailable) return;  
  fbStatus = 'syncing'; updateSyncBar();  
  try{  
    fbApplyingRemote = true; // это наша собственная запись — не нужно перерисовывать по эху listener'а  
    await fbDb.ref(FB_DATA_PATH).set(DB);  
    fbStatus = 'ok'; fbLastSync = new Date();  
  }catch(e){  
    fbStatus = 'error';  
  }finally{  
    setTimeout(()=>{ fbApplyingRemote = false; }, 300);  
    updateSyncBar();  
  }  
}  
  
// Живая синхронизация: как только кто-то другой меняет данные в Firebase,  
// это устройство сразу получает обновление и перерисовывает экран.  
function startFbListener(){  
  if(!fbAvailable) return;  
  try{  
    fbDb.ref(FB_DATA_PATH).on('value', (snap)=>{  
      if(fbApplyingRemote) return; // пропускаем эхо собственной записи  
      if(!snap.exists()) return;  
      const remote = snap.val();  
      if(!remote || !remote.users || !remote.lines) return;  
      if(JSON.stringify(remote) === JSON.stringify(DB)) return; // ничего не изменилось  
      DB = migrateDBShape(remote);  
      saveDBLocal(DB);  
      fbStatus = 'ok'; fbLastSync = new Date();  
      checkNewRegistrations();  
      render();  
    }, ()=>{ fbStatus = 'error'; updateSyncBar(); });  
  }catch(e){  
    fbStatus = 'error';  
  }  
}  
  
/* saveDB сохраняет снимок ПРЕДЫДУЩЕГО состояния в локальный (несинхронизируемый)  
   стек отмены — так кнопка «Отменить последнее действие» работает без раздувания  
   общей базы Firebase историей полных копий данных. */  
function saveDB(db){  
  const prevRaw = safeStorage.getItem(DB_KEY);  
  if(prevRaw){  
    localUndoStack.push(prevRaw);  
    if(localUndoStack.length > 10) localUndoStack.shift();  
  }  
  saveDBLocal(db);  
  scheduleFbSave();  
}  
  
/* Показывает всплывающий индикатор сохранения конкретного товара: кольцо
   с процентами 0→100%, которое по завершении реальной записи в Firebase
   сменяется зелёной галочкой. Если Firebase недоступен — доводит до 100%
   и показывает "Сохранено локально" (данные уже лежат в localStorage). */
let spState = null;
function showSaveProgress(){
  const R = 14, C = 2*Math.PI*R;
  let el = document.getElementById('saveProgressToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'saveProgressToast';
    el.className = 'save-progress';
    el.innerHTML =
      '<div class="spRing">'+
        '<svg viewBox="0 0 32 32">'+
          '<circle class="spBg" cx="16" cy="16" r="'+R+'"></circle>'+
          '<circle class="spFg" id="spFg" cx="16" cy="16" r="'+R+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"></circle>'+
        '</svg>'+
        '<div class="spPct" id="spPct">0%</div>'+
        '<div class="spCheck" id="spCheck">&#10003;</div>'+
      '</div>'+
      '<div class="spLabel" id="spLabel">Сохранение товара...</div>';
    document.body.appendChild(el);
  }
  if(spState){
    clearInterval(spState.timer);
    clearTimeout(spState.hideTimer);
  }
  el.classList.remove('success','error');
  const fg = el.querySelector('#spFg');
  const pctEl = el.querySelector('#spPct');
  const labelEl = el.querySelector('#spLabel');
  labelEl.textContent = 'Сохранение товара...';

  let pct = 0;
  const setPct = (p)=>{
    pct = p;
    pctEl.textContent = Math.round(p) + '%';
    fg.setAttribute('stroke-dashoffset', String(C - (C * p / 100)));
  };
  setPct(0);
  requestAnimationFrame(()=> el.classList.add('show'));

  const timer = setInterval(()=>{
    if(pct < 90) setPct(Math.min(90, pct + (pct < 55 ? 9 : 3)));
  }, 100);
  spState = { el, timer, hideTimer: null };

  const finish = (ok, label)=>{
    clearInterval(timer);
    setPct(100);
    setTimeout(()=>{
      el.classList.add(ok ? 'success' : 'error');
      labelEl.textContent = label;
      spState.hideTimer = setTimeout(()=> el.classList.remove('show'), 1100);
    }, 220);
  };

  if(!fbAvailable){
    setTimeout(()=> finish(true, 'Сохранено локально'), 350);
    return;
  }
  clearTimeout(fbSaveTimer);
  fbPush()
    .then(()=> finish(fbStatus === 'ok', fbStatus === 'ok' ? 'Сохранено' : 'Ошибка синхронизации'))
    .catch(()=> finish(false, 'Ошибка синхронизации'));
}

function undoLastAction(){  
  if(localUndoStack.length === 0){ toast('Нечего отменять'); return; }  
  const prevRaw = localUndoStack.pop();  
  DB = migrateDBShape(JSON.parse(prevRaw));  
  saveDBLocal(DB);  
  scheduleFbSave();  
  toast('Действие отменено');  
  render();  
}  
  
function updateSyncBar(){  
  const el = document.getElementById('syncBar');  
  if(!el) return;  
  el.outerHTML = renderSyncBar();  
  bindSyncBarEvents();  
}  
  
function renderSyncBar(){  
  let dotClass = 'off', label = 'Подключение к базе...';  
  if(!fbAvailable){ dotClass='off'; label='Офлайн-режим (нет связи с базой, данные только на этом устройстве)'; }  
  else if(fbStatus==='syncing'){ dotClass='spin'; label='Синхронизация...'; }  
  else if(fbStatus==='ok'){ dotClass=''; label = fbLastSync ? `Синхронизировано · ${fbLastSync.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}` : 'Синхронизировано'; }  
  else if(fbStatus==='error'){ dotClass='off'; label='Ошибка синхронизации'; }  
  return `  
    <div class="sync-bar" id="syncBar">  
      <div style="display:flex;align-items:center;gap:8px;"><span class="dot ${dotClass}"></span>${label}</div>  
      <button class="refresh" id="btnFbRefresh">Обновить</button>  
    </div>  
  `;  
}  
function bindSyncBarEvents(){  
  const b = document.getElementById('btnFbRefresh');  
  if(b) b.onclick = async ()=>{  
    if(!fbAvailable){ toast('Нет связи с базой — проверьте интернет и перезагрузите страницу'); return; }  
    await fbPull(); render(); toast('Данные обновлены');  
  };  
}

  const app = document.getElementById('app');  
  const prevContent = app.querySelector('.content');  
  const sameTab = !!session && lastRenderedTab === currentTab;  
  const scrollTop = (prevContent && sameTab) ? prevContent.scrollTop : 0;  
  if(!session){  
    app.innerHTML = renderAuth();  
    bindAuthEvents();  
    lastRenderedTab = null;  
  } else {  
    app.innerHTML = renderShell();  
    bindShellEvents();  
    const newContent = app.querySelector('.content');  
    if(newContent) newContent.scrollTop = scrollTop;  
    lastRenderedTab = currentTab;  
  }  
}

function bindAuthEvents(){  
  document.getElementById('tabLogin').onclick = ()=>{ authTab='login'; authError=''; render(); };  
  document.getElementById('tabReg').onclick = ()=>{ authTab='register'; authError=''; render(); };  
  if(authTab==='login'){ document.getElementById('btnDoLogin').onclick = doLogin; }  
  else { document.getElementById('btnDoReg').onclick = doRegister; }  
}  
  
async function doLogin(){  
  const login = document.getElementById('loginLogin').value.trim();  
  const pass = document.getElementById('loginPass').value;  
  await fbPull(); // подтянуть свежие данные перед проверкой  
  const user = DB.users.find(u => u.login === login);  
  const ok = user ? await checkUserPassword(user, pass) : false;  
  if(!ok){  
    authError = 'Неверный логин или пароль';  
    render();  
    return;  
  }  
  if(user.password != null && !user.passwordHash){  
    await setUserPassword(user, pass); // тихая миграция старого открытого пароля в хэш  
    saveDB(DB);  
  }  
  session = user.login;  
  safeStorage.setItem(SESSION_KEY, session);  
  authError = '';  
  knownPendingCount = null; // пересчитать после входа, чтобы не спамить старыми заявками  
  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){  
    registerPushForCurrentUser(); // если разрешение уже выдано раньше — обновим токен молча  
  }  
  showWelcome(user.fio, false);  
}  
  
async function doRegister(){  
  const fio = document.getElementById('regFio').value.trim();  
  const login = document.getElementById('regLogin').value.trim();  
  const pass = document.getElementById('regPass').value;  
  if(!fio || !login || !pass){ authError = 'Заполните все поля'; render(); return; }  
  await fbPull();  
  if(DB.users.find(u => u.login === login)){ authError = 'Такой логин уже занят'; render(); return; }  
  const user = { login, fio, role:'user', access:'none', telegram:'' };  
  await setUserPassword(user, pass);  
  DB.users.push(user);  
  saveDB(DB);  
  session = login;  
  safeStorage.setItem(SESSION_KEY, session);  
  authError = '';  
  showWelcome(fio, true);  
}  
  
function showWelcome(fio, isNew){  
  const overlay = document.createElement('div');  
  overlay.className = 'welcome-overlay';  
  overlay.innerHTML = `  
    <div class="welcome-ring">${isNew ? '🎉' : '👋'}</div>  
    <h2>${isNew ? 'Добро пожаловать' : 'С возвращением'}</h2>  
    <h1>${escapeHtml(fio)}</h1>  
    <div class="dots"><span></span><span></span><span></span></div>  
  `;  
  document.body.appendChild(overlay);  
  setTimeout(()=>{  
    overlay.classList.add('hide');  
    setTimeout(()=>{  
      overlay.remove();  
      currentTab = 'home';  
      render();  
    }, 480);  
  }, 5000);  
}  
  
function escapeHtml(s){  
  const d = document.createElement('div');  
  d.innerText = s == null ? '' : s;  
  return d.innerHTML;  
}  

/* Показывает количество товара: если 0 — красная надпись «Закончилась»  
   вместо цифры «0»; если <= LOW_STOCK_THRESHOLD — цифра красным (мало  
   осталось). Используется везде, где отображается остаток артикула:  
   в ряду/линии, в «Все модели» и в результатах поиска. */  
function qtyBadgeHtml(qty){  
  if(qty <= 0) return `<span class="val" style="color:var(--danger);font-size:11px;font-weight:800;white-space:nowrap;">Закончилась</span>`;  
  if(qty <= LOW_STOCK_THRESHOLD) return `<span class="val" style="color:var(--danger);font-weight:800;">${qty}</span>`;  
  return `<span class="val">${qty}</span>`;  
}  

  
/* ============================= APP SHELL ============================= */  
function roleLabel(u){  
  if(u.role==='admin') return 'АДМИН';  
  if(u.role==='manager') return 'МЕНЕДЖЕР';  
  return u.access==='granted' ? 'ДОСТУП' : 'ОЖИДАНИЕ';  
}  
  
function renderShell(){  
  const u = currentUser();  
  if(!u){ session=null; safeStorage.removeItem(SESSION_KEY); return renderAuth(); }  
  checkNewRegistrations();  
  
  let body = '';  
  if(currentTab === 'home') body = renderHome(u);  
  else if(currentTab === 'search') body = renderSearch(u);  
  else if(currentTab === 'history') body = renderHistory(u);  
  else if(currentTab === 'profile') body = renderProfile(u);  
  else if(currentTab === 'allmodels') body = renderAllModels(u);  
  else if(currentTab === 'lowstock') body = renderLowStock(u);  
  
  const pendingCount = (u.role==='admin'||u.role==='manager') ? DB.users.filter(x=>x.role==='user' && x.access==='none').length : 0;  
  
  return `  
    <div class="topbar">  
      <div class="who">  
        <b>${escapeHtml(u.fio)}</b>  
        <span>@${escapeHtml(u.login)}</span>  
      </div>  
      <div style="display:flex;align-items:center;gap:8px;">  
        <span class="badge">${roleLabel(u)}</span>  
        <button class="logout" id="btnLogout">Выйти</button>  
      </div>  
    </div>  
    <div class="content" id="content">  
      ${currentTab==='home' ? renderSyncBar() : ''}  
      ${body}  
    </div>  
    <div class="toast" id="toast"></div>  
    <div class="bottom-nav">  
      <button data-tab="home" class="${currentTab==='home'?'active':''}"><span class="ic">${NAV_ICONS.home}</span>Главная</button>  
      <button data-tab="search" class="${currentTab==='search'?'active':''}"><span class="ic">${NAV_ICONS.search}</span>Поиск</button>  
      <button data-tab="history" class="${currentTab==='history'?'active':''}"><span class="ic">${NAV_ICONS.history}</span>История</button>  
      <button data-tab="profile" class="${(currentTab==='profile'||currentTab==='allmodels'||currentTab==='lowstock')?'active':''}" style="position:relative;">  
        <span class="ic">${NAV_ICONS.profile}</span>Профиль  
        ${pendingCount>0 ? `<span style="position:absolute;top:2px;right:14px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;">${pendingCount}</span>` : ''}  
      </button>  
    </div>  
  `;  
}  
  
function bindShellEvents(){  
  document.getElementById('btnLogout').onclick = ()=>{  
    session = null;  
    safeStorage.removeItem(SESSION_KEY);  
    render();  
  };  
  document.querySelectorAll('.bottom-nav button').forEach(btn=>{  
    btn.onclick = ()=>{ currentTab = btn.dataset.tab; render(); };  
  });  
  if(currentTab==='home') bindSyncBarEvents();  
  bindTabEvents();  
}  
  
function bindTabEvents(){  
  if(currentTab==='home') bindHomeEvents();  
  else if(currentTab==='search') bindSearchEvents();  
  else if(currentTab==='history') bindHistoryEvents();  
  else if(currentTab==='profile') bindProfileEvents();  
  else if(currentTab==='allmodels') bindAllModelsEvents();  
  else if(currentTab==='lowstock') bindLowStockEvents();  
}  
  
/* ============================= HOME (СКЛАД) ============================= */  
function hasAccess(u){ return u.role==='admin' || u.role==='manager' || u.access==='granted'; }  
function canEdit(u){ return u.role==='admin' || u.role==='manager'; }  
  
function renderWarehouseTabs(u){  
  if(!DB.warehouses.find(w=>w.id===currentWarehouseId)) currentWarehouseId = DB.warehouses[0].id;  
  return `  
    <div class="wh-tabs" style="display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;">  
      ${DB.warehouses.map(w=>`  
        <button data-wh="${w.id}" class="wh-tab ${w.id===currentWarehouseId?'active':''}"  
          style="flex:none;padding:7px 12px;border-radius:10px;border:1px solid var(--border);  
          background:${w.id===currentWarehouseId?'var(--accent)':'var(--card)'};  
          color:${w.id===currentWarehouseId?'#fff':'var(--text)'};font-size:12px;font-weight:700;white-space:nowrap;">  
          🏬 ${escapeHtml(w.name)}  
        </button>`).join('')}  
      ${canEdit(u) ? `<button id="btnAddWh" style="flex:none;padding:7px 12px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;">+ склад</button>` : ''}  
      ${canEdit(u) && DB.warehouses.length>1 ? `<button id="btnRenameWh" style="flex:none;padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;">✎</button>  
      <button id="btnDelWh" style="flex:none;padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--danger);font-size:12px;">✕</button>` : ''}  
    </div>  
  `;  
}  
  
function renderLowStockBanner(u){  
  if(!canEdit(u)) return '';  
  const low = computeLowStock().filter(x=> x.line ? x.line.warehouseId===currentWarehouseId : x.item.warehouseId===currentWarehouseId);  
  if(low.length===0) return '';  
  return `  
    <div class="pending-card" style="background:#3a1f1f;border:1px solid var(--danger);text-align:left;padding:12px 14px;margin-bottom:12px;">  
      <div style="font-weight:800;color:var(--danger);margin-bottom:6px;">⚠️ Низкий остаток (${low.length})</div>  
      ${low.slice(0,6).map(x=>`<div style="font-size:12px;color:var(--text);padding:2px 0;">${escapeHtml(x.item.sku)} — ${x.item.qty} шт. <span style="color:var(--muted)">(${x.line ? escapeHtml(x.line.name)+'/'+escapeHtml(x.row.name) : 'без линии/ряда'})</span></div>`).join('')}  
      ${low.length>6 ? `<div style="font-size:11px;color:var(--muted);margin-top:4px;">и ещё ${low.length-6}...</div>` : ''}  
    </div>  
  `;  
}  
  
function renderHome(u){  
  if(!hasAccess(u)){  
    const admin = DB.users.find(x=>x.role==='admin');  
    const tg = admin && admin.telegram ? admin.telegram.replace('@','') : '';  
    return `  
      <div class="pending-card">  
        <div class="ico">🔒</div>  
        <h3>Требуется разрешение администратора</h3>  
        <p>Ваш аккаунт создан, но доступ к складу пока закрыт.<br>Свяжитесь с администратором, чтобы получить доступ.</p>  
        ${tg ? `<a class="tg-btn" href="https://t.me/${tg}" target="_blank">✈️ Написать в Telegram</a>` : `<p style="font-size:12px">Администратор пока не указал Telegram</p>`}  
      </div>  
    `;  
  }  
  
  let html = renderWarehouseTabs(u) + renderLowStockBanner(u);  
  const linesHere = DB.lines.filter(l=>l.warehouseId===currentWarehouseId);  
  
  linesHere.forEach(line=>{  
    const isOpen = !!openLines[line.id];  
    html += `  
      <div class="line" data-line="${line.id}">  
        <div class="line-head" data-toggle-line="${line.id}">  
          <div class="ttl">📏 <span class="txt">${escapeHtml(line.name)}</span></div>  
          <div style="display:flex;align-items:center;gap:6px;">  
            ${canEdit(u) ? `<button class="del-x" data-del-line="${line.id}">✕</button>` : ''}  
            <span class="chev ${isOpen?'open':''}">›</span>  
          </div>  
        </div>  
        <div class="line-body ${isOpen?'open':''}">  
          ${line.rows.map(row=>renderRow(u, line, row)).join('')}  
          ${canEdit(u) ? `  
            <div class="add-inline">  
              <input type="text" placeholder="Новый ряд..." data-new-row="${line.id}">  
              <button data-add-row="${line.id}">+</button>  
            </div>  
          ` : ''}  
        </div>  
      </div>  
    `;  
  });  
  
  if(canEdit(u)){  
    html += `<button class="add-line-btn" id="btnAddLine">+ Добавить линию</button>`;  
  }  
  
  return html + (linesHere.length ? '' : `<div class="empty-state"><div class="ico">📭</div>Нет данных.${canEdit(u) ? ' Добавьте первую линию.' : ''}</div>`);  
}  
  
function renderRow(u, line, row){  
  const key = line.id+'_'+row.id;  
  const isOpen = !!openRows[key];  
  return `  
    <div class="row" data-row="${row.id}">  
      <div class="row-head" data-toggle-row="${key}">  
        <div class="ttl">📂 <span class="txt">${escapeHtml(row.name)}</span> <span style="color:var(--muted);font-weight:400;flex:none;">(${row.items.length})</span></div>  
        <div style="display:flex;align-items:center;gap:6px;">  
          ${canEdit(u) ? `<button class="del-x" data-del-row="${line.id}|${row.id}">✕</button>` : ''}  
          <span class="chev ${isOpen?'open':''}">›</span>  
        </div>  
      </div>  
      <div class="row-body ${isOpen?'open':''}">  
        ${row.items.map(it=>renderItem(u, line, row, it)).join('')}  
        ${canEdit(u) ? `  
          <div class="add-inline" style="flex-wrap:wrap;">  
            <input type="text" placeholder="Артикул..." data-new-sku="${line.id}|${row.id}" style="flex:1 1 120px;">  
            <input type="number" min="0" value="0" class="qty" data-new-qty="${line.id}|${row.id}" style="width:64px;">  
            <button type="button" data-scan="${line.id}|${row.id}" title="Сканировать штрихкод" style="flex:none;">📷</button>  
            <button data-add-item="${line.id}|${row.id}">+</button>  
          </div>  
        ` : ''}  
      </div>  
    </div>  
  `;  
}  
  
function renderItem(u, line, row, it){  
  const low = (it.minQty > 0 && it.qty <= it.minQty) || it.qty <= LOW_STOCK_THRESHOLD;  
  const available = it.qty - (it.reserved||0);  
  return `  
    <div class="item" data-item="${it.id}" style="${low?'border-color:var(--danger);':''}">  
      <div class="info">  
        <div class="sku">${escapeHtml(it.sku)} ${it.category ? `<span style="font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 5px;margin-left:4px;">${escapeHtml(it.category)}</span>` : ''} ${(it.minQty > 0 && it.qty <= it.minQty) ? `<span style="font-size:10px;color:var(--danger);">⚠️ мин ${it.minQty}</span>` : ''}</div>  
        <div class="loc">${escapeHtml(line.name)} / ${escapeHtml(row.name)}${it.reserved>0 ? ` · рез: ${it.reserved} · доступно: ${available}` : ''}</div>  
        ${it.comment ? `<div class="loc" style="color:var(--muted);font-style:italic;">💬 ${escapeHtml(it.comment)}</div>` : ''}  
      </div>  
      <div class="qty-ctrl">  
        <button data-qty-dec="${line.id}|${row.id}|${it.id}">−</button>  
        ${qtyBadgeHtml(it.qty)}  
        <button data-qty-inc="${line.id}|${row.id}|${it.id}">+</button>  
        ${canEdit(u) ? `<button class="del-x" data-edit-item="${line.id}|${row.id}|${it.id}" title="Категория/минимум/резерв/комментарий" style="color:var(--muted);">✎</button>` : ''}  
        ${canEdit(u) ? `<button class="del-x" data-del-item="${line.id}|${row.id}|${it.id}">✕</button>` : ''}  
      </div>  
    </div>  
  `;  
}  
  
function bindHomeEvents(){  
  const u = currentUser();  
  if(!hasAccess(u)) return;  
  
  document.querySelectorAll('[data-wh]').forEach(el=>{  
    el.onclick = ()=>{ currentWarehouseId = el.dataset.wh; render(); };  
  });  
  if(canEdit(u)){  
    const btnAddWh = document.getElementById('btnAddWh');  
    if(btnAddWh) btnAddWh.onclick = ()=>{  
      const name = prompt('Название нового склада:');  
      if(name && name.trim()){  
        const w = { id: uid(), name: name.trim() };  
        DB.warehouses.push(w);  
        currentWarehouseId = w.id;  
        saveDB(DB); render();  
      }  
    };  
    const btnRenWh = document.getElementById('btnRenameWh');  
    if(btnRenWh) btnRenWh.onclick = ()=>{  
      const w = DB.warehouses.find(x=>x.id===currentWarehouseId);  
      const name = prompt('Новое название склада:', w.name);  
      if(name && name.trim()){ w.name = name.trim(); saveDB(DB); render(); }  
    };  
    const btnDelWh = document.getElementById('btnDelWh');  
    if(btnDelWh) btnDelWh.onclick = ()=>{  
      if(DB.warehouses.length<=1) return;  
      if(!confirm('Удалить склад вместе со всеми линиями и товарами на нём?')) return;  
      DB.lines = DB.lines.filter(l=>l.warehouseId!==currentWarehouseId);  
      DB.warehouses = DB.warehouses.filter(w=>w.id!==currentWarehouseId);  
      currentWarehouseId = DB.warehouses[0].id;  
      saveDB(DB); render();  
    };  
  }  
  
  document.querySelectorAll('[data-toggle-line]').forEach(el=>{  
    el.onclick = ()=>{ const id = el.dataset.toggleLine; openLines[id] = !openLines[id]; render(); };  
  });  
  document.querySelectorAll('[data-toggle-row]').forEach(el=>{  
    el.onclick = ()=>{ const id = el.dataset.toggleRow; openRows[id] = !openRows[id]; render(); };  
  });  
  document.querySelectorAll('[data-qty-inc]').forEach(el=>{ el.onclick = ()=> changeQty(el.dataset.qtyInc, 1); });  
  document.querySelectorAll('[data-qty-dec]').forEach(el=>{ el.onclick = ()=> changeQty(el.dataset.qtyDec, -1); });  
  
  if(canEdit(u)){  
    const btnAddLine = document.getElementById('btnAddLine');  
    if(btnAddLine) btnAddLine.onclick = ()=>{  
      const name = prompt('Название линии:');  
      if(name && name.trim()){  
        DB.lines.push({ id:uid(), name:name.trim(), warehouseId: currentWarehouseId, rows:[] });  
        saveDB(DB); render();  
      }  
    };  
    document.querySelectorAll('[data-del-line]').forEach(el=>{  
      el.onclick = (e)=>{ e.stopPropagation();  
        if(confirm('Удалить линию и всё её содержимое?')){  
          const line = DB.lines.find(l=>l.id===el.dataset.delLine);  
          if(line){  
            const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
            line.rows.forEach(row=>{  
              row.items.forEach(it=>{  
                logEvent('delete', { sku: it.sku, lineName: line.name, rowName: row.name, warehouseName: wh?wh.name:'', qty: it.qty });  
              });  
            });  
          }  
          DB.lines = DB.lines.filter(l=>l.id!==el.dataset.delLine);  
          saveDB(DB); render();  
        }  
      };  
    });  
    document.querySelectorAll('[data-add-row]').forEach(el=>{  
      el.onclick = ()=>{  
        const lineId = el.dataset.addRow;  
        const input = document.querySelector(`[data-new-row="${lineId}"]`);  
        const name = input.value.trim();  
        if(!name) return;  
        const line = DB.lines.find(l=>l.id===lineId);  
        line.rows.push({ id:uid(), name, items:[] });  
        saveDB(DB);  
        openLines[lineId] = true;  
        render();  
      };  
    });  
    document.querySelectorAll('[data-del-row]').forEach(el=>{  
      el.onclick = (e)=>{ e.stopPropagation();  
        const [lineId, rowId] = el.dataset.delRow.split('|');  
        if(confirm('Удалить ряд и его артикулы?')){  
          const line = DB.lines.find(l=>l.id===lineId);  
          const row = line.rows.find(r=>r.id===rowId);  
          if(row){  
            const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
            row.items.forEach(it=>{  
              logEvent('delete', { sku: it.sku, lineName: line.name, rowName: row.name, warehouseName: wh?wh.name:'', qty: it.qty });  
            });  
          }  
          line.rows = line.rows.filter(r=>r.id!==rowId);  
          saveDB(DB); render();  
        }  
      };  
    });  
    document.querySelectorAll('[data-scan]').forEach(el=>{  
      el.onclick = ()=>{  
        const [lineId, rowId] = el.dataset.scan.split('|');  
        openBarcodeScanner((code)=>{  
          const input = document.querySelector(`[data-new-sku="${lineId}|${rowId}"]`);  
          if(input){ input.value = code; input.focus(); }  
        });  
      };  
    });  
    document.querySelectorAll('[data-add-item]').forEach(el=>{  
      el.onclick = ()=>{  
        const [lineId, rowId] = el.dataset.addItem.split('|');  
        const skuInput = document.querySelector(`[data-new-sku="${lineId}|${rowId}"]`);  
        const qtyInput = document.querySelector(`[data-new-qty="${lineId}|${rowId}"]`);  
        const sku = skuInput.value.trim();  
        const qty = parseInt(qtyInput.value) || 0;  
        if(!sku) return;  
        const line = DB.lines.find(l=>l.id===lineId);  
        const row = line.rows.find(r=>r.id===rowId);  
        // повторный артикул в этом же ряду просто увеличивает количество,  
        // а не создаёт вторую строку с тем же товаром  
        const existing = row.items.find(i=>skuMatch(i.sku, sku));  
        if(existing){ existing.qty += qty; }  
        else { row.items.push({ id:uid(), sku, qty, minQty:0, reserved:0, category:'', comment:'' }); }  
        if(qty > 0){  
          const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
          logEvent('in', { sku, lineName: line.name, rowName: row.name, warehouseName: wh?wh.name:'', qty });  
        }  
        saveDB(DB);  
        showSaveProgress();  
        openLines[lineId] = true;  
        openRows[lineId+'_'+rowId] = true;  
        render();  
      };  
    });  
    document.querySelectorAll('[data-del-item]').forEach(el=>{  
      el.onclick = ()=>{  
        const [lineId, rowId, itemId] = el.dataset.delItem.split('|');  
        const line = DB.lines.find(l=>l.id===lineId);  
        const row = line.rows.find(r=>r.id===rowId);  
        const item = row.items.find(i=>i.id===itemId);  
        if(item){  
          const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
          logEvent('delete', { sku: item.sku, lineName: line.name, rowName: row.name, warehouseName: wh?wh.name:'', qty: item.qty });  
        }  
        row.items = row.items.filter(i=>i.id!==itemId);  
        saveDB(DB); render();  
      };  
    });  
    document.querySelectorAll('[data-edit-item]').forEach(el=>{  
      el.onclick = ()=>{  
        const [lineId, rowId, itemId] = el.dataset.editItem.split('|');  
        const line = DB.lines.find(l=>l.id===lineId);  
        const row = line.rows.find(r=>r.id===rowId);  
        const item = row.items.find(i=>i.id===itemId);  
        const category = prompt('Категория (можно оставить пустым):', item.category||'');  
        if(category===null) return;  
        const minQtyStr = prompt('Минимальный остаток для предупреждения (0 — выключено):', String(item.minQty||0));  
        if(minQtyStr===null) return;  
        const reservedStr = prompt('Зарезервировано (не более текущего остатка ' + item.qty + '):', String(item.reserved||0));  
        if(reservedStr===null) return;  
        const comment = prompt('Комментарий к товару (можно оставить пустым):', item.comment||'');  
        if(comment===null) return;  
        item.category = category.trim();  
        item.minQty = Math.max(0, parseInt(minQtyStr)||0);  
        item.reserved = Math.min(item.qty, Math.max(0, parseInt(reservedStr)||0));  
        item.comment = comment.trim();  
        saveDB(DB); render();  
        toast('Товар обновлён');  
      };  
    });  
  }  
}  
  
function changeQty(key, delta){  
  const [lineId, rowId, itemId] = key.split('|');  
  const line = DB.lines.find(l=>l.id===lineId);  
  const row = line.rows.find(r=>r.id===rowId);  
  const item = row.items.find(i=>i.id===itemId);  
  const before = item.qty;  
  item.qty = Math.max(0, item.qty + delta);  
  if(item.reserved > item.qty) item.reserved = item.qty; // резерв не может превышать остаток  
  const actualDelta = item.qty - before; // фактическое изменение (не даём уйти в минус)  
  const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
  if(actualDelta > 0){  
    logEvent('in', { sku: item.sku, lineName: line.name, rowName: row.name, warehouseName: wh?wh.name:'', qty: actualDelta });  
  } else if(actualDelta < 0){  
    logEvent('out', { sku: item.sku, lineName: line.name, rowName: row.name, warehouseName: wh?wh.name:'', qty: -actualDelta });  
  }  
  saveDB(DB);  
  render();  
}  
  
/* ============================= ВСЕ МОДЕЛИ ============================= */  
/* Плоский список всех товаров текущего склада (включая товары без линии  
   и ряда), с возможностью добавить товар сразу без линии/ряда и перенести  
   существующий товар в другую линию/ряд или наоборот — сделать «ничьим». */  
  
/* Сравнение артикулов без учёта регистра и лишних пробелов —  
   используется, чтобы не плодить дубликаты одной и той же модели  
   в одном и том же месте (ряду/складе), а просто суммировать количество. */  
function skuMatch(a, b){  
  return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase();  
}  
  
function amCollect(){  
  const linesHere = DB.lines.filter(l=>l.warehouseId===currentWarehouseId);  
  const list = [];  
  linesHere.forEach(line=>{  
    line.rows.forEach(row=>{  
      row.items.forEach(it=>{  
        list.push({ item: it, type:'row', line, row, ref:`row|${line.id}|${row.id}|${it.id}` });  
      });  
    });  
  });  
  DB.unassigned.filter(it=>it.warehouseId===currentWarehouseId).forEach(it=>{  
    list.push({ item: it, type:'unassigned', line:null, row:null, ref:`unassigned|${it.id}` });  
  });  
  return list;  
}  
  
function amParseRef(ref){  
  const parts = ref.split('|');  
  if(parts[0]==='row'){  
    const [, lineId, rowId, itemId] = parts;  
    const line = DB.lines.find(l=>l.id===lineId);  
    const row = line && line.rows.find(r=>r.id===rowId);  
    const item = row && row.items.find(i=>i.id===itemId);  
    return { type:'row', line, row, item, itemId };  
  }  
  const itemId = parts[1];  
  const item = DB.unassigned.find(i=>i.id===itemId);  
  return { type:'unassigned', item, itemId };  
}  
  
function amRemoveFromCurrentLocation(loc){  
  if(loc.type==='row'){  
    loc.row.items = loc.row.items.filter(i=>i.id!==loc.itemId);  
  } else {  
    DB.unassigned = DB.unassigned.filter(i=>i.id!==loc.itemId);  
  }  
}  
  
/* Переносит товар в другую линию/ряд текущего склада, либо (если lineId  
   пустой) делает его «ничьим» — без линии и ряда. */  
function amMoveItem(ref, newLineId, newRowId){  
  const loc = amParseRef(ref);  
  if(!loc.item) return false;  
  const item = loc.item;  
  if(newLineId){  
    const line = DB.lines.find(l=>l.id===newLineId);  
    const row = line && line.rows.find(r=>r.id===newRowId);  
    if(!row){ alert('Выберите ряд для этой линии (или оставьте «Без линии»).'); return false; }  
    // если в целевом ряду уже есть такой же артикул — просто прибавляем  
    // количество к нему, а не создаём вторую строку с тем же товаром  
    const existing = row.items.find(i=>i!==item && skuMatch(i.sku, item.sku));  
    amRemoveFromCurrentLocation(loc);  
    if(existing){  
      existing.qty += item.qty;  
      if(existing.reserved > existing.qty) existing.reserved = existing.qty;  
    } else {  
      delete item.warehouseId;  
      row.items.push(item);  
    }  
  } else {  
    const existing = DB.unassigned.find(i=>i!==item && i.warehouseId===currentWarehouseId && skuMatch(i.sku, item.sku));  
    amRemoveFromCurrentLocation(loc);  
    if(existing){  
      existing.qty += item.qty;  
      if(existing.reserved > existing.qty) existing.reserved = existing.qty;  
    } else {  
      item.warehouseId = currentWarehouseId;  
      DB.unassigned.push(item);  
    }  
  }  
  saveDB(DB);  
  return true;  
}  
  
/* Переносит сразу несколько товаров (по их ref) в одну и ту же линию/ряд.  
   Используется групповым переносом с чекбоксами на странице «Все модели». */  
function amMoveItems(refs, newLineId, newRowId){  
  if(newLineId){  
    const line = DB.lines.find(l=>l.id===newLineId);  
    const row = line && line.rows.find(r=>r.id===newRowId);  
    if(!row){ alert('Выберите ряд для этой линии (или оставьте «Без линии»).'); return false; }  
  }  
  let moved = 0;  
  refs.forEach(ref=>{ if(amMoveItem(ref, newLineId, newRowId)) moved++; });  
  return moved;  
}  
  
function amDeleteItem(ref){  
  const loc = amParseRef(ref);  
  if(!loc.item) return;  
  const item = loc.item;  
  let lineName = '', rowName = '', whName = '';  
  if(loc.type==='row'){  
    const wh = DB.warehouses.find(w=>w.id===loc.line.warehouseId);  
    lineName = loc.line.name; rowName = loc.row.name; whName = wh?wh.name:'';  
  } else {  
    const wh = DB.warehouses.find(w=>w.id===item.warehouseId);  
    whName = wh?wh.name:'';  
  }  
  logEvent('delete', { sku: item.sku, lineName, rowName, warehouseName: whName, qty: item.qty });  
  amRemoveFromCurrentLocation(loc);  
  saveDB(DB);  
}  
  
function amChangeQty(ref, delta){  
  const loc = amParseRef(ref);  
  if(!loc.item) return;  
  const item = loc.item;  
  const before = item.qty;  
  item.qty = Math.max(0, item.qty + delta);  
  if(item.reserved > item.qty) item.reserved = item.qty;  
  const actualDelta = item.qty - before;  
  let lineName = '', rowName = '', whName = '';  
  if(loc.type==='row'){  
    const wh = DB.warehouses.find(w=>w.id===loc.line.warehouseId);  
    lineName = loc.line.name; rowName = loc.row.name; whName = wh?wh.name:'';  
  } else {  
    const wh = DB.warehouses.find(w=>w.id===item.warehouseId);  
    whName = wh?wh.name:'';  
  }  
  if(actualDelta > 0) logEvent('in', { sku: item.sku, lineName, rowName, warehouseName: whName, qty: actualDelta });  
  else if(actualDelta < 0) logEvent('out', { sku: item.sku, lineName, rowName, warehouseName: whName, qty: -actualDelta });  
  saveDB(DB);  
}  
  
/* Добавляет новый товар: если передана линия — кладёт в выбранный ряд,  
   иначе добавляет товар на склад совсем без линии и ряда. */  
function amAddDirect(sku, qty, lineId, rowId, comment){  
  const wh = DB.warehouses.find(w=>w.id===currentWarehouseId);  
  const whName = wh ? wh.name : '';  
  let lineName = '', rowName = '';  
  if(lineId){  
    const line = DB.lines.find(l=>l.id===lineId);  
    const row = line && line.rows.find(r=>r.id===rowId);  
    if(!row){ alert('Выберите ряд для этой линии (или оставьте «Без линии»).'); return false; }  
    // повторный артикул в том же ряду просто увеличивает количество,  
    // а не создаёт вторую строку с тем же товаром  
    const existing = row.items.find(i=>skuMatch(i.sku, sku));  
    if(existing){  
      existing.qty += qty;  
      if(comment && comment.trim()) existing.comment = comment.trim();  
    } else {  
      row.items.push({ id: uid(), sku, qty, minQty:0, reserved:0, category:'', comment: (comment||'').trim() });  
    }  
    lineName = line.name; rowName = row.name;  
    openLines[lineId] = true;  
    openRows[lineId+'_'+rowId] = true;  
  } else {  
    const existing = DB.unassigned.find(i=>i.warehouseId===currentWarehouseId && skuMatch(i.sku, sku));  
    if(existing){  
      existing.qty += qty;  
      if(comment && comment.trim()) existing.comment = comment.trim();  
    } else {  
      const newItem = { id: uid(), sku, qty, minQty:0, reserved:0, category:'', comment: (comment||'').trim(), warehouseId: currentWarehouseId };  
      DB.unassigned.push(newItem);  
    }  
  }  
  if(qty > 0){  
    logEvent('in', { sku, lineName, rowName, warehouseName: whName, qty });  
  }  
  saveDB(DB);  
  showSaveProgress();  
  return true;  
}  
  
function amEditItem(ref){

        || `<option value="">— у линии нет рядов, добавьте ряд на Главной —</option>`;

    if(!sku){ toast('Введите артикул'); return; }  
    if(amAddDirect(sku, qty, lineId, rowId, comment)){  
      render();  
    }  
  };  
  
  bindAmListEvents(u);  
}  
  
/* Точечно перерисовывает только список товаров (и панель группового  
   переноса) внутри #amListArea, не трогая поле поиска и форму добавления —  
   так фокус, курсор и раскладка клавиатуры в поиске не сбрасываются. */  
function refreshAmListArea(){  
  const u = currentUser();  
  const wrap = document.getElementById('amListArea');  
  if(!wrap) return;  
  wrap.innerHTML = renderAmListArea(u);  
  if(canEdit(u)) bindAmListEvents(u);  
}  
  
function bindAmListEvents(u){  
  if(!canEdit(u)) return;  
  
  document.querySelectorAll('[data-am-qty-inc]').forEach(el=>{  
    el.onclick = ()=>{ amChangeQty(el.dataset.amQtyInc, 1); refreshAmListArea(); };  
  });  
  document.querySelectorAll('[data-am-qty-dec]').forEach(el=>{  
    el.onclick = ()=>{ amChangeQty(el.dataset.amQtyDec, -1); refreshAmListArea(); };  
  });  
  document.querySelectorAll('[data-am-edit]').forEach(el=>{  
    el.onclick = ()=>{ amEditItem(el.dataset.amEdit); refreshAmListArea(); toast('Товар обновлён'); };  
  });  
  document.querySelectorAll('[data-am-del]').forEach(el=>{  
    el.onclick = ()=>{  
      if(confirm('Удалить этот товар?')){  
        selectedMoveRefs.delete(el.dataset.amDel);  
        amDeleteItem(el.dataset.amDel);  
        refreshAmListArea();  
      }  
    };  
  });  
  document.querySelectorAll('[data-am-move]').forEach(el=>{  
    el.onclick = ()=>{  
      moveItemRef = (moveItemRef === el.dataset.amMove) ? null : el.dataset.amMove;  
      refreshAmListArea();  
    };  
  });  
  
  // чекбоксы множественного выбора товаров для группового переноса  
  document.querySelectorAll('[data-am-select]').forEach(el=>{  
    el.onchange = ()=>{  
      const ref = el.dataset.amSelect;  
      if(el.checked) selectedMoveRefs.add(ref);  
      else selectedMoveRefs.delete(ref);  
      refreshAmListArea();  
    };  
  });  
  
  const moveLineSel = document.getElementById('amMoveLine');  
  const moveRowWrap = document.getElementById('amMoveRowWrap');  
  const moveRowSel = document.getElementById('amMoveRow');  
  if(moveLineSel){  
    moveLineSel.onchange = ()=>{  
      const line = DB.lines.find(l=>l.id===moveLineSel.value);  
      if(!line){ moveRowWrap.style.display = 'none'; moveRowSel.innerHTML = ''; return; }  
      moveRowWrap.style.display = '';  
      moveRowSel.innerHTML = line.rows.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')  
        || `<option value="">— у линии нет рядов —</option>`;  
    };  
  }  
  
  const btnMoveSave = document.getElementById('btnAmMoveSave');  
  if(btnMoveSave) btnMoveSave.onclick = ()=>{  
    const ref = btnMoveSave.dataset.ref;  
    const lineId = moveLineSel.value;  
    const rowId = lineId ? moveRowSel.value : '';  
    if(amMoveItem(ref, lineId, rowId)){  
      moveItemRef = null;  
      toast('Товар перемещён');  
      refreshAmListArea();  
    }  
  };  
  const btnMoveCancel = document.getElementById('btnAmMoveCancel');  
  if(btnMoveCancel) btnMoveCancel.onclick = ()=>{ moveItemRef = null; refreshAmListArea(); };  
  
  // групповой перенос нескольких выбранных товаров  
  const btnBulkMoveOpen = document.getElementById('btnBulkMoveOpen');  
  if(btnBulkMoveOpen) btnBulkMoveOpen.onclick = ()=>{ bulkMoveOpen = true; moveItemRef = null; refreshAmListArea(); };  
  
  const btnBulkClear = document.getElementById('btnBulkClear');  
  if(btnBulkClear) btnBulkClear.onclick = ()=>{ selectedMoveRefs.clear(); bulkMoveOpen = false; refreshAmListArea(); };  
  
  const bulkLineSel = document.getElementById('amBulkMoveLine');  
  const bulkRowWrap = document.getElementById('amBulkMoveRowWrap');  
  const bulkRowSel = document.getElementById('amBulkMoveRow');  
  if(bulkLineSel){  
    bulkLineSel.onchange = ()=>{  
      const line = DB.lines.find(l=>l.id===bulkLineSel.value);  
      if(!line){ bulkRowWrap.style.display = 'none'; bulkRowSel.innerHTML = ''; return; }  
      bulkRowWrap.style.display = '';  
      bulkRowSel.innerHTML = line.rows.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')  
        || `<option value="">— у линии нет рядов —</option>`;  
    };  
  }  
  
  const btnBulkMoveSave = document.getElementById('btnBulkMoveSave');  
  if(btnBulkMoveSave) btnBulkMoveSave.onclick = ()=>{  
    const lineId = bulkLineSel.value;  
    const rowId = lineId ? bulkRowSel.value : '';  
    if(lineId && !rowId){ alert('Выберите ряд для этой линии (или оставьте «Без линии»).'); return; }  
    const refs = Array.from(selectedMoveRefs);  
    const moved = amMoveItems(refs, lineId, rowId);  
    if(moved){  
      selectedMoveRefs.clear();  
      bulkMoveOpen = false;  
      toast(`Перемещено товаров: ${moved}`);  
      refreshAmListArea();  
    }  
  };  
  const btnBulkMoveCancel = document.getElementById('btnBulkMoveCancel');  
  if(btnBulkMoveCancel) btnBulkMoveCancel.onclick = ()=>{ bulkMoveOpen = false; refreshAmListArea(); };  
}  
  
/* ============================= BARCODE / QR SCANNER =============================  
   Использует нативный BarcodeDetector API (есть в Chrome/Edge/Android).  
   В Safari/iOS API пока не поддерживается — тогда просто показываем сообщение,  
   и товар как обычно можно ввести вручную. */  
function openBarcodeScanner(onResult){  
  if(typeof BarcodeDetector === 'undefined'){  
    alert('Сканер штрихкодов не поддерживается этим браузером. Введите артикул вручную.');  
    return;  
  }  
  const modal = document.createElement('div');  
  modal.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;';  
  modal.innerHTML = `  
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#111;">  
      <b style="color:#fff;">Наведите камеру на штрихкод</b>  
      <button id="btnCloseScan" style="background:none;border:none;color:#fff;font-size:20px;">✕</button>  
    </div>  
    <video id="scanVideo" style="flex:1;width:100%;object-fit:cover;" playsinline autoplay muted></video>  
  `;  
  document.body.appendChild(modal);  
  let stream = null;  
  let stopped = false;  
  const video = modal.querySelector('#scanVideo');  
  const cleanup = ()=>{  
    stopped = true;  
    if(stream) stream.getTracks().forEach(t=>t.stop());  
    modal.remove();  
  };  
  modal.querySelector('#btnCloseScan').onclick = cleanup;  
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(async (s)=>{  
    stream = s;  
    video.srcObject = s;  
    const detector = new BarcodeDetector();  
    const tick = async ()=>{  
      if(stopped) return;  
      try{  
        const codes = await detector.detect(video);  
        if(codes && codes.length){  
          const value = codes[0].rawValue;  
          cleanup();  
          onResult(value);  
          return;  
        }  
      }catch(e){ /* ignore single-frame errors */ }  
      requestAnimationFrame(tick);  
    };  
    requestAnimationFrame(tick);  
  }).catch(()=>{  
    alert('Не удалось получить доступ к камере.');  
    cleanup();  
  });  
}  
  
/* ============================= SEARCH ============================= */  
let searchQuery = '';  
let searchCategory = '';  
  
function renderSearch(u){  
  if(!hasAccess(u)){  
    return `<div class="empty-state"><div class="ico">🔒</div>Поиск станет доступен после подтверждения администратора</div>`;  
  }  
  const allCategories = [...new Set(DB.lines.flatMap(l=>l.rows.flatMap(r=>r.items.map(i=>i.category).filter(Boolean))))].sort();  
  
  // Результаты вынесены в отдельный контейнер (#searchResultsArea), который  
  // обновляется отдельной функцией при каждом нажатии клавиши, БЕЗ полной  
  // перерисовки страницы. Раньше render() пересоздавал вообще весь DOM на  
  // каждый символ, включая само поле <input> — из-за этого на телефоне после  
  // ввода одной цифры терялся фокус и клавиатура сбрасывалась на буквы.  
  return `  
    <div class="search-box">  
      <span>🔍</span>  
      <input id="searchInput" type="text" placeholder="Поиск по артикулу, линии, ряду..." value="${escapeHtml(searchQuery)}">  
    </div>  
    ${allCategories.length ? `  
      <select id="searchCategorySel" style="width:100%;margin-bottom:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;">  
        <option value="">Все категории</option>  
        ${allCategories.map(c=>`<option value="${escapeHtml(c)}" ${c===searchCategory?'selected':''}>${escapeHtml(c)}</option>`).join('')}  
      </select>  
    ` : ''}  
    <div id="searchResultsArea">${renderSearchResults()}</div>  
  `;  
}  
  
function renderSearchResults(){  
  const results = [];  
  if(searchQuery.trim().length > 0 || searchCategory){  
    const q = searchQuery.trim().toLowerCase();  
    DB.lines.forEach(line=>{  
      line.rows.forEach(row=>{  
        row.items.forEach(it=>{  
          if(searchCategory && it.category !== searchCategory) return;  
          const matchesText = q==='' || it.sku.toLowerCase().includes(q) || line.name.toLowerCase().includes(q) || row.name.toLowerCase().includes(q);  
          if(matchesText){  
            const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
            results.push({line, row, item: it, whName: wh?wh.name:''});  
          }  
        });  
      });  
    });  
  }  
  
  return (searchQuery.trim()==='' && !searchCategory) ? `<div class="empty-state"><div class="ico">🔎</div>Начните вводить артикул или выберите категорию</div>` :  
    results.length===0 ? `<div class="empty-state"><div class="ico">🚫</div>Ничего не найдено</div>` :  
    results.map(r=>`  
      <div class="search-result" style="${r.item.qty <= LOW_STOCK_THRESHOLD ? 'border-color:var(--danger);' : ''}">  
        <div class="info">  
          <div class="sku">${escapeHtml(r.item.sku)}${r.item.category ? ` <span style="font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 5px;">${escapeHtml(r.item.category)}</span>` : ''}</div>  
          <div class="loc">${escapeHtml(r.whName)} · ${escapeHtml(r.line.name)} / ${escapeHtml(r.row.name)}</div>  
          ${r.item.comment ? `<div class="loc" style="color:var(--muted);font-style:italic;">💬 ${escapeHtml(r.item.comment)}</div>` : ''}  
        </div>  
        <div class="qty-ctrl">  
          <button data-qty-dec="${r.line.id}|${r.row.id}|${r.item.id}">−</button>  
          ${qtyBadgeHtml(r.item.qty)}  
          <button data-qty-inc="${r.line.id}|${r.row.id}|${r.item.id}">+</button>  
        </div>  
      </div>  
    `).join('');  
}  
  
function refreshSearchResultsArea(){  
  const wrap = document.getElementById('searchResultsArea');  
  if(!wrap) return;  
  wrap.innerHTML = renderSearchResults();  
  bindSearchResultsEvents();  
}  
  
function bindSearchResultsEvents(){  
  // changeQty() сам вызывает полный render() (это ок — не при вводе текста)  
  document.querySelectorAll('[data-qty-inc]').forEach(el=>{ el.onclick = ()=> changeQty(el.dataset.qtyInc, 1); });  
  document.querySelectorAll('[data-qty-dec]').forEach(el=>{ el.onclick = ()=> changeQty(el.dataset.qtyDec, -1); });  
}  
  
function bindSearchEvents(){  
  const input = document.getElementById('searchInput');  
  if(input){  
    input.focus();  
    input.setSelectionRange(input.value.length, input.value.length);  
    // на ввод символа обновляем только результаты ниже — само поле ввода  
    // не трогаем, поэтому фокус и раскладка клавиатуры не сбрасываются  
    input.oninput = (e)=>{  
      searchQuery = e.target.value;  
      refreshSearchResultsArea();  
    };  
  }  
  const catSel = document.getElementById('searchCategorySel');  
  if(catSel) catSel.onchange = (e)=>{ searchCategory = e.target.value; refreshSearchResultsArea(); };  
  bindSearchResultsEvents();  
}  
  
/* ============================= МАЛО / ЗАКОНЧИЛИСЬ ============================= */  
/* Сводный экран: артикулы, у которых суммарный остаток по всему складу  
   (одинаковые артикулы из разных линий/рядов складываются вместе) равен  
   нулю («закончились») или не превышает LOW_STOCK_THRESHOLD («мало»).  
   Каждый артикул — отдельная строка-кнопка; по нажатию показывается  
   расшифровка по местам хранения. */  
function renderLowStock(u){  
  if(!hasAccess(u)) return `<div class="empty-state"><div class="ico">🔒</div>Доступно после подтверждения администратора</div>`;  
  const wh = DB.warehouses.find(w=>w.id===currentWarehouseId);  
  const agg = computeSkuAggregates();  
  const outOfStock = agg.filter(a=> a.qty <= 0);  
  const lowOnly = agg.filter(a=> a.qty > 0 && a.qty <= LOW_STOCK_THRESHOLD);  
  
  const renderRow = (a)=>{  
    const locSummary = a.entries.length > 1  
      ? `${a.entries.length} мест(а) хранения — нажмите для подробностей`  
      : (a.entries[0].type==='row' ? `${escapeHtml(a.entries[0].line.name)} / ${escapeHtml(a.entries[0].row.name)}` : 'Без линии/ряда');  
    return `  
      <button class="item" data-agg-sku="${encodeURIComponent(a.sku)}" style="width:100%;text-align:left;border:1px solid var(--danger);cursor:pointer;">  
        <div class="info">  
          <div class="sku">${escapeHtml(a.sku)}</div>  
          <div class="loc">${locSummary}</div>  
        </div>  
        <div class="qty-ctrl">${qtyBadgeHtml(a.qty)}</div>  
      </button>  
    `;  
  };  
  
  let html = `  
    <button class="btn secondary" id="btnBackFromLowStock" style="margin-bottom:12px;">← Назад в профиль</button>  
    <div class="section-title">Мало / закончились · ${escapeHtml(wh?wh.name:'')}</div>  
    <div class="stat-grid">  
      <div class="stat-tile">  
        <div class="stat-num" style="color:var(--danger)">${outOfStock.length}</div>  
        <div class="stat-label">Закончились</div>  
      </div>  
      <div class="stat-tile">  
        <div class="stat-num" style="color:var(--danger)">${lowOnly.length}</div>  
        <div class="stat-label">Мало (≤${LOW_STOCK_THRESHOLD} шт.)</div>  
      </div>  
      <div class="stat-tile">  
        <div class="stat-num">${outOfStock.length + lowOnly.length}</div>  
        <div class="stat-label">Всего проблемных</div>  
      </div>  
    </div>  
  
    <div class="section-title">🔴 Закончились (${outOfStock.length})</div>  
    ${outOfStock.length===0  
      ? `<div class="empty-state"><div class="ico">✅</div>Нет закончившихся артикулов</div>`  
      : outOfStock.map(renderRow).join('')}  
  
    <div class="section-title">🟡 Мало на складе, ≤${LOW_STOCK_THRESHOLD} шт. (${lowOnly.length})</div>  
    ${lowOnly.length===0  
      ? `<div class="empty-state"><div class="ico">✅</div>Нет позиций с низким остатком</div>`  
      : lowOnly.map(renderRow).join('')}  
  `;  
  
  return html;  
}  
  
function bindLowStockEvents(){  
  const u = currentUser();  
  if(!hasAccess(u)) return;  
  
  const btnBack = document.getElementById('btnBackFromLowStock');  
  if(btnBack) btnBack.onclick = ()=>{ currentTab = 'profile'; render(); };  
  
  const agg = computeSkuAggregates();  
  document.querySelectorAll('[data-agg-sku]').forEach(el=>{  
    el.onclick = ()=>{  
      const sku = decodeURIComponent(el.dataset.aggSku);  
      const a = agg.find(x=> x.sku === sku);  
      if(!a) return;  
      const lines = a.entries.map(e=>{  
        const loc = e.type==='row' ? `${e.line.name} / ${e.row.name}` : 'Без линии/ряда';  
        return `• ${loc} — ${e.item.qty} шт.`;  
      }).join('\n');  
      alert(`${a.sku}\nВсего на складе: ${a.qty} шт.\n\n${lines}`);  
    };  
  });  
}  
  
/* ============================= ЭКСПОРТ CSV ============================= */  
function downloadCsv(filename, rows){  
  const csv = rows.map(r=> r.map(cell=>{  
    const s = String(cell==null?'':cell);  
    return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;  
  }).join(';')).join('\r\n');  
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });  
  const url = URL.createObjectURL(blob);  
  const a = document.createElement('a');  
  a.href = url; a.download = filename;  
  document.body.appendChild(a); a.click(); a.remove();  
  URL.revokeObjectURL(url);  
}  
  
function exportStockCsv(){  
  const rows = [['Склад','Линия','Ряд','Артикул','Категория','Остаток','Минимум','Резерв','Доступно']];  
  DB.lines.forEach(line=>{  
    const wh = DB.warehouses.find(w=>w.id===line.warehouseId);  
    line.rows.forEach(row=>{  
      row.items.forEach(it=>{  
        rows.push([wh?wh.name:'', line.name, row.name, it.sku, it.category||'', it.qty, it.minQty||0, it.reserved||0, it.qty-(it.reserved||0)]);  
      });  
    });  
  });  
  DB.unassigned.forEach(it=>{  
    const wh = DB.warehouses.find(w=>w.id===it.warehouseId);  
    rows.push([wh?wh.name:'', '', '', it.sku, it.category||'', it.qty, it.minQty||0, it.reserved||0, it.qty-(it.reserved||0)]);  
  });  
  downloadCsv('sklad_ostatki.csv', rows);  
}  
  
function exportHistoryCsv(list){  
  const rows = [['Дата','Время','Тип','Артикул','Склад','Линия','Ряд','Количество','Пользователь','Логин']];  
  list.forEach(ev=>{  
    const d = new Date(ev.at);  
    rows.push([  
      d.toLocaleDateString('ru-RU'), d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),  
      ev.type==='in'?'Приход':(ev.type==='delete'?'Удалён полностью':'Списание'), ev.sku, ev.warehouseName||'', ev.lineName, ev.rowName, ev.qty, ev.byFio, ev.byLogin  
    ]);  
  });  
  downloadCsv('sklad_istoria.csv', rows);  
}  
  
/* ============================= ИСТОРИЯ ============================= */

      ` : ''}

    </div>  
    ${list.length===0 ? `<div class="empty-state"><div class="ico">📜</div>Событий не найдено</div>` :  
      list.slice(0,300).map(ev=>`  
        <div class="search-result" style="${ev.type==='delete' ? 'border-color:var(--danger);' : ''}">  
          <div class="info">  
            <div class="sku">${ev.type==='in' ? '📥' : (ev.type==='delete' ? '🗑️' : '📤')} ${escapeHtml(ev.sku)} ${
