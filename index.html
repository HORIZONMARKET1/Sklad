                : `<span style="color:${ev.type==='in'?'var(--accent)':'var(--danger)'};font-weight:800;">${ev.type==='in'?'+':'-'}${ev.qty}</span>`  
            }</div>  
            <div class="loc">${escapeHtml(ev.warehouseName||'')} ${ev.lineName?'· '+escapeHtml(ev.lineName):''}${ev.rowName?'/'+escapeHtml(ev.rowName):''} · ${ev.type==='delete'?'удалил: ':''}${escapeHtml(ev.byFio||ev.byLogin||'')}</div>  
          </div>  
          <div style="font-size:11px;color:var(--muted);text-align:right;flex:none;">  
            ${new Date(ev.at).toLocaleDateString('ru-RU')}<br>${new Date(ev.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}  
          </div>  
        </div>  
      `).join('')  
    }  
    ${list.length>300 ? `<div class="empty-state" style="padding:10px;"><div style="font-size:11px;">Показаны последние 300 из ${list.length} — уточните фильтр или экспортируйте в CSV</div></div>` : ''}  
  `;  
}  
  
function bindHistoryEvents(){  
  const qEl = document.getElementById('histQ');  
  if(qEl) qEl.oninput = (e)=>{ histFilterQuery = e.target.value; render(); };  
  const fromEl = document.getElementById('histFrom');  
  if(fromEl) fromEl.onchange = (e)=>{ histFilterFrom = e.target.value; render(); };  
  const toEl = document.getElementById('histTo');  
  if(toEl) toEl.onchange = (e)=>{ histFilterTo = e.target.value; render(); };  
  const userEl = document.getElementById('histUser');  
  if(userEl) userEl.onchange = (e)=>{ histFilterUser = e.target.value; render(); };  
  const btnExport = document.getElementById('btnExportHist');  
  if(btnExport) btnExport.onclick = ()=>{  
    let list = DB.history.slice().reverse();  
    if(histFilterFrom){ const t = new Date(histFilterFrom+'T00:00:00').getTime(); list = list.filter(ev=>ev.at >= t); }  
    if(histFilterTo){ const t = new Date(histFilterTo+'T23:59:59').getTime(); list = list.filter(ev=>ev.at <= t); }  
    if(histFilterUser){ list = list.filter(ev=>ev.byLogin === histFilterUser); }  
    if(histFilterQuery.trim()){ const q = histFilterQuery.trim().toLowerCase(); list = list.filter(ev=> (ev.sku||'').toLowerCase().includes(q)); }  
    exportHistoryCsv(list);  
  };  
}  
  
/* ============================= PROFILE ============================= */  
function renderProfile(u){  
  const initials = u.fio.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();  
  const roleText = u.role==='admin' ? 'Администратор' : (u.role==='manager' ? 'Менеджер' : 'Пользователь');  
  
  let html = `  
    <div class="profile-card">  
      <div class="profile-avatar">${initials}</div>  
      <h3>${escapeHtml(u.fio)}</h3>  
      <div class="sub">Логин: @${escapeHtml(u.login)}</div>  
      <div class="sub">Роль: ${roleText} · ${hasAccess(u)?'доступ открыт':'ожидает доступа'}</div>  
    </div>  
  
    <div class="section-title">Изменить данные</div>  
    <div class="profile-card">  
      <div class="field"><label>Новый логин</label><input id="editLogin" type="text" value="${escapeHtml(u.login)}"></div>  
      <div class="field"><label>Новый пароль</label><input id="editPass" type="password" placeholder="Оставьте пустым, чтобы не менять"></div>  
      <button class="btn" id="btnSaveProfile">Сохранить</button>  
      <div class="err" id="profileErr"></div>  
    </div>  
  `;  
  
  if(hasAccess(u)){  
    html += `  
      <div class="profile-card" style="padding:0;overflow:hidden;">  
        <button class="btn secondary" id="btnAllModels" style="width:100%;border-radius:0;margin:0;">📦 Все модели</button>  
      </div>  
      <div class="profile-card" style="padding:0;overflow:hidden;">  
        <button class="btn secondary" id="btnLowStock" style="width:100%;border-radius:0;margin:0;color:var(--danger);">⚠️ Мало / закончились товары</button>  
      </div>  
    `;  
    const stats = computeStats();  
    const series = computeDailySeries(14);  
    const maxVal = Math.max(1, ...series.map(d=>Math.max(d.in, d.out)));  
    html += `  
      <div class="section-title">Статистика склада</div>  
      <div class="stat-grid">  
        <div class="stat-tile">  
          <div class="stat-num">${stats.totalModels}</div>  
          <div class="stat-label">Моделей на складе</div>  
        </div>  
        <div class="stat-tile">  
          <div class="stat-num" style="color:var(--accent2)">${stats.totalIn}</div>  
          <div class="stat-label">Новых поступило</div>  
        </div>  
        <div class="stat-tile">  
          <div class="stat-num" style="color:var(--danger)">${stats.totalOut}</div>  
          <div class="stat-label">Продано</div>  
        </div>  
      </div>  
  
      <div class="profile-card">  
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Приход/списание за 14 дней</div>  
        <div style="display:flex;align-items:flex-end;gap:3px;height:90px;">  
          ${series.map(d=>`  
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:1px;" title="${d.label}: +${d.in} / -${d.out}">  
              <div style="width:100%;display:flex;gap:1px;align-items:flex-end;height:100%;">  
                <div style="flex:1;background:var(--accent2);border-radius:2px 2px 0 0;height:${Math.round((d.in/maxVal)*100)}%;min-height:${d.in>0?'2px':'0'};"></div>  
                <div style="flex:1;background:var(--danger);border-radius:2px 2px 0 0;height:${Math.round((d.out/maxVal)*100)}%;min-height:${d.out>0?'2px':'0'};"></div>  
              </div>  
            </div>  
          `).join('')}  
        </div>  
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px;">  
          <span>${series[0].label}</span><span>${series[series.length-1].label}</span>  
        </div>  
        <div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted);">  
          <span><span style="display:inline-block;width:8px;height:8px;background:var(--accent2);border-radius:2px;margin-right:4px;"></span>Приход</span>  
          <span><span style="display:inline-block;width:8px;height:8px;background:var(--danger);border-radius:2px;margin-right:4px;"></span>Списание</span>  
        </div>  
      </div>  
  
      <div class="profile-card">  
        <button class="btn secondary" id="btnExportStock" style="margin-bottom:8px;">⬇️ Экспорт остатков (CSV)</button>  
        ${canEdit(u) ? `<button class="btn secondary" id="btnEnableNotif" style="margin-bottom:8px;">🔔 Включить push-уведомления</button>` : ''}  
        ${canEdit(u) ? `<button class="btn secondary" id="btnUndo">↩️ Отменить последнее действие</button>` : ''}  
      </div>  
    `;  
  }  
  
  if(u.role==='admin'){  
    html += `  
      <div class="section-title">Telegram для связи с пользователями</div>  
      <div class="profile-card">  
        <div class="field"><label>Ваш Telegram (username без @)</label><input id="editTg" type="text" value="${escapeHtml(u.telegram||'')}" placeholder="username"></div>  
        <button class="btn secondary" id="btnSaveTg">Сохранить Telegram</button>  
      </div>  
  
      <div class="section-title">Синхронизация с Firebase</div>  
      <div class="profile-card">  
        <div class="err" style="color:var(--muted);margin-bottom:6px;">  
          Проект: <b style="color:var(--text)">${firebaseConfig.projectId}</b>  
        </div>  
        <p style="font-size:12px;color:var(--muted);line-height:1.6;margin:0;">  
          Данные склада хранятся в общей базе Firebase Realtime Database и  
          автоматически обновляются на всех устройствах в реальном времени —  
          отдельный токен для записи не нужен. Доступ к записи/чтению базы  
          регулируется правилами безопасности (Rules) в консоли Firebase —  
          рекомендуем ограничить их, чтобы посторонние не могли менять данные.  
          Пароли пользователей хранятся не в открытом виде, а как соль + SHA-256 хэш.  
        </p>  
      </div>  
  
      <div class="section-title">Пользователи (${DB.users.filter(x=>x.role!=='admin').length})</div>  
      ${DB.users.filter(x=>x.role!=='admin').map(x=>`  
        <div class="user-row">  
          <div class="info">  
            <b>${escapeHtml(x.fio)}</b>  
            <span>@${escapeHtml(x.login)}${x.role==='manager' ? ' · менеджер' : ''}</span>  
          </div>  
          <select class="access-sel" data-access-user="${x.login}">  
            <option value="none" ${(x.access==='none'&&x.role!=='manager')?'selected':''}>Нет доступа</option>  
            <option value="granted" ${(x.access==='granted'&&x.role!=='manager')?'selected':''}>Доступ открыт</option>  
            <option value="manager" ${x.role==='manager'?'selected':''}>Менеджер</option>  
          </select>  
        </div>  
      `).join('') || `<div class="empty-state" style="padding:30px 0"><div class="ico">👥</div>Пока никто не зарегистрировался</div>`}  
  
      <div class="section-title">Кто добавил новые товары</div>  
      ${(function(){  
        const stats = computeStats();  
        if(stats.byUserList.length === 0){  
          return `<div class="empty-state" style="padding:24px 0"><div class="ico">📦</div>Пока никто не пополнял склад</div>`;  
        }  
        return stats.byUserList.map(x=>`  
          <div class="user-row">  
            <div class="info">  
              <b>${escapeHtml(x.fio || x.login)}</b>  
              <span>@${escapeHtml(x.login)}</span>  
            </div>  
            <span class="badge" style="color:var(--accent2)">+${x.qty}</span>  
          </div>  
        `).join('');  
      })()}  
  
      <div class="section-title" style="color:var(--danger);">Опасная зона</div>  
      <div class="profile-card" style="border:1px solid var(--danger);">  
        <p style="font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 10px;">  
          Удаляет все склады, линии, ряды, товары и историю прихода/списания  
          у всех пользователей — необратимо и сразу для всех устройств.  
          Список пользователей и их доступ при этом не трогаются.  
          Это действие доступно только администратору.  
        </p>  
        <button class="btn danger" id="btnWipeData">🗑️ Удалить все данные склада</button>  
      </div>  
    `;  
  }  
  
  return html;  
}  
  
function bindProfileEvents(){  
  const u = currentUser();  
  
  document.getElementById('btnSaveProfile').onclick = async ()=>{  
    const newLogin = document.getElementById('editLogin').value.trim();  
    const newPass = document.getElementById('editPass').value;  
    const errEl = document.getElementById('profileErr');  
    if(!newLogin){ errEl.textContent = 'Логин не может быть пустым'; return; }  
    if(newLogin !== u.login && DB.users.find(x=>x.login===newLogin)){  
      errEl.textContent = 'Такой логин уже занят';  
      return;  
    }  
    u.login = newLogin;  
    if(newPass) await setUserPassword(u, newPass);  
    saveDB(DB);  
    session = newLogin;  
    safeStorage.setItem(SESSION_KEY, session);  
    errEl.textContent = '';  
    toast('Данные сохранены');  
    render();  
  };  
  
  if(hasAccess(u)){  
    const btnAllModels = document.getElementById('btnAllModels');  
    if(btnAllModels) btnAllModels.onclick = ()=>{  
      allModelsQuery = ''; moveItemRef = null; selectedMoveRefs.clear(); bulkMoveOpen = false;  
      currentTab = 'allmodels';  
      render();  
    };  
  
    const btnLowStock = document.getElementById('btnLowStock');  
    if(btnLowStock) btnLowStock.onclick = ()=>{  
      currentTab = 'lowstock';  
      render();  
    };  
  
    const btnExportStock = document.getElementById('btnExportStock');  
    if(btnExportStock) btnExportStock.onclick = exportStockCsv;  
  
    const btnNotif = document.getElementById('btnEnableNotif');  
    if(btnNotif) btnNotif.onclick = async ()=>{  
      if(!VAPID_KEY){  
        toast('Backend ещё не настроен разработчиком (нет VAPID-ключа)');  
        return;  
      }  
      const ok = await registerPushForCurrentUser();  
      toast(ok ? 'Push-уведомления включены на этом устройстве' : 'Не удалось включить (проверьте разрешение браузера)');  
    };  
  
    const btnUndo = document.getElementById('btnUndo');  
    if(btnUndo) btnUndo.onclick = ()=>{ undoLastAction(); };  
  }  
  
  if(u.role==='admin'){  
    const btnTg = document.getElementById('btnSaveTg');  
    if(btnTg) btnTg.onclick = ()=>{  
      const tg = document.getElementById('editTg').value.trim();  
      u.telegram = tg;  
      saveDB(DB);  
      toast('Telegram сохранён');  
    };  
  
    document.querySelectorAll('[data-access-user]').forEach(sel=>{  
      sel.onchange = ()=>{  
        const login = sel.dataset.accessUser;  
        const target = DB.users.find(x=>x.login===login);  
        if(sel.value === 'manager'){  
          target.role = 'manager';  
          target.access = 'granted';  
        } else {  
          target.role = 'user';  
          target.access = sel.value;  
        }  
        saveDB(DB);  
        toast(`Права для ${target.fio} обновлены`);  
        render();  
      };  
    });  
  
    const btnWipe = document.getElementById('btnWipeData');  
    if(btnWipe) btnWipe.onclick = ()=>{  
      if(!confirm('Точно удалить ВСЕ склады, линии, товары и историю у ВСЕХ пользователей? Это необратимо.')) return;  
      const typed = prompt('Для подтверждения наберите слово УДАЛИТЬ (заглавными):');  
      if(typed !== 'УДАЛИТЬ'){ toast('Отменено — слово введено неверно'); return; }  
      DB.warehouses = [ { id: DEFAULT_WAREHOUSE_ID, name: 'Основной склад' } ];  
      DB.lines = [];  
      DB.unassigned = [];  
      DB.history = [];  
      currentWarehouseId = DEFAULT_WAREHOUSE_ID;  
      openLines = {};  
      openRows = {};  
      saveDB(DB); // сохраняет локально и сразу пушит очищенные данные в Firebase на все устройства  
      toast('Все данные склада удалены');  
      currentTab = 'home';  
      render();  
    };  
  }  
}  
  
/* ============================= INIT ============================= */  
(async function init(){  
 try{  
  render(); // интерфейс рисуется сразу, до и независимо от Firebase  
  await initFirebase(); // ждёт максимум ~8с (2 обязательных файла по 4с), либо отвечает раньше  
  await fbPull();  
  await migratePlaintextPasswords(DB);  
  saveDBLocal(DB);  
  render();  
  startFbListener(); // дальше данные будут обновляться в реальном времени сами  
  if(session && typeof Notification !== 'undefined' && Notification.permission === 'granted'){  
    registerPushForCurrentUser();  
  }  
 }catch(e){  
  var box = document.createElement('div');  
  box.style.cssText = 'position:fixed;inset:0;background:#1a0000;color:#ffb3b3;font:13px/1.5 monospace;padding:16px;z-index:999999;overflow:auto;white-space:pre-wrap;';  
  box.textContent = 'INIT ERROR: ' + (e && (e.stack || e.message || e));  
  document.documentElement.appendChild(box);  
 }  
})();  
</script>
